[project]
name = "walt-compiler"
version = "0.1.0"
description = "Compile a query contract + semantic model into SQL"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["duckdb>=1.1", "psycopg[binary]>=3.2", "pytest>=8"]

[project.scripts]
walt-compile = "walt_compiler.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["walt_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs the Postgres container (make test-pg)"]
addopts = "-m 'not postgres'"
